<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>khan harness</title>
  <link rel="stylesheet" href="/player/tokens.css">
  <link rel="stylesheet" href="/player/renderer/core/core.css">
  <link rel="stylesheet" href="/player/renderer/pictures/pictures.css">
  <style>
    html, body { margin: 0; background: var(--khan-page-bg); color: var(--khan-panel-text); font: 13px/1.4 ui-monospace, monospace; }
    #board-wrap { position: relative; width: min(100vw, calc((100vh - 2.5rem) * 16 / 9)); aspect-ratio: 16 / 9; background: var(--khan-board-bg); }
    #board-wrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #harness-status { padding: 0.5rem 0.75rem; color: var(--khan-panel-muted); }
  </style>
</head>
<body>
  <div id="harness-status">harness: loading…</div>
  <div id="board-wrap">
    <canvas id="board" width="1600" height="900"></canvas>
    <canvas id="pen" width="1600" height="900"></canvas>
  </div>
  <script type="module" src="/player/harness.js"></script>
</body>
</html>
